<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FORGE Before vs After / 生成前后对比</title>
  <desc id="desc">Comparison of an AI-written draft without FORGE and a format-stable DOCX generated with FORGE.</desc>
  <defs>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#174ea6"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans{font-family:Inter,Segoe UI,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Arial,sans-serif}
      .navy{fill:#0f172a}.muted{fill:#64748b}.blue{fill:#174ea6}.green{fill:#16a34a}.red{fill:#ef3b2d}
      .small{font-size:17px}.body{font-size:20px}.label{font-size:22px;font-weight:700}.h2{font-size:34px;font-weight:800}.title{font-size:54px;font-weight:850}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="sans title navy">FORGE Before vs After</text>
  <text x="800" y="102" text-anchor="middle" class="sans h2 navy">生成前后对比</text>
  <text x="800" y="136" text-anchor="middle" class="sans body muted">From AI-written text to format-stable DOCX</text>
  <text x="800" y="165" text-anchor="middle" class="sans body muted">从 AI 写出内容到格式稳定的 Word 文档</text>

  <!-- left panel -->
  <rect x="28" y="190" width="758" height="590" rx="22" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="407" y="235" text-anchor="middle" class="sans h2" fill="#3f3f46">Without FORGE</text>
  <text x="407" y="268" text-anchor="middle" class="sans body" fill="#52525b">不使用 FORGE</text>
  <rect x="167" y="286" width="196" height="36" rx="18" fill="#e5e7eb"/>
  <text x="265" y="311" text-anchor="middle" class="sans small" fill="#4b5563" font-weight="700">AI-written draft</text>

  <!-- left document -->
  <rect x="55" y="330" width="370" height="398" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#shadow)"/>
  <text x="78" y="360" class="sans" font-size="20" font-weight="800" fill="#111827">1. Project Overview</text>
  <text x="78" y="386" class="sans" font-size="12" fill="#374151">This document introduces the project background, goals,</text>
  <text x="78" y="403" class="sans" font-size="12" fill="#374151">and key deliverables.</text>
  <text x="78" y="433" class="sans" font-size="17" font-weight="800" fill="#111827">1.1 Background</text>
  <text x="78" y="457" class="sans" font-size="11" fill="#374151">AI is changing how we create content. However, formatting</text>
  <text x="78" y="474" class="sans" font-size="11" fill="#374151">in AI outputs is often inconsistent.</text>
  <text x="78" y="506" class="sans" font-size="22" font-weight="800" fill="#111827">1.2 Objectives</text>
  <text x="78" y="532" class="sans" font-size="11" fill="#374151">We aim to provide format-stable DOCX output that is</text>
  <text x="78" y="549" class="sans" font-size="11" fill="#374151">consistent and easy to reuse.</text>
  <text x="78" y="578" class="sans" font-size="18" font-weight="800" fill="#111827">2. Deliverables</text>
  <text x="78" y="600" class="sans" font-size="10" fill="#374151">The following table summarizes the key deliverables.</text>
  <rect x="78" y="613" width="306" height="70" fill="#fff" stroke="#9ca3af"/>
  <rect x="78" y="613" width="306" height="19" fill="#e5e7eb"/>
  <line x1="110" y1="613" x2="110" y2="683" stroke="#9ca3af"/><line x1="232" y1="613" x2="232" y2="683" stroke="#9ca3af"/><line x1="301" y1="613" x2="301" y2="683" stroke="#9ca3af"/>
  <line x1="78" y1="632" x2="384" y2="632" stroke="#9ca3af"/><line x1="78" y1="649" x2="384" y2="649" stroke="#d1d5db"/><line x1="78" y1="666" x2="384" y2="666" stroke="#d1d5db"/>
  <text x="89" y="627" class="sans" font-size="8" font-weight="700">ID</text><text x="134" y="627" class="sans" font-size="8" font-weight="700">Deliverable</text><text x="250" y="627" class="sans" font-size="8" font-weight="700">Owner</text><text x="316" y="627" class="sans" font-size="8" font-weight="700">Due Date</text>
  <text x="87" y="644" class="sans" font-size="8">D1</text><text x="120" y="644" class="sans" font-size="8">PRD Document</text><text x="247" y="644" class="sans" font-size="8">Team A</text><text x="310" y="644" class="sans" font-size="8">2025-05-20</text>
  <rect x="78" y="692" width="150" height="27" rx="2" fill="#dbeafe"/>
  <path d="M78 715 L110 697 L134 708 L158 699 L188 716 Z" fill="#93c5fd"/><path d="M125 715 L165 694 L197 705 L228 696 L228 719 Z" fill="#60a5fa" opacity=".9"/>
  <text x="238" y="709" class="sans" font-size="9" fill="#4b5563">Figure 1: Project landscape</text>
  <text x="345" y="697" text-anchor="middle" class="sans" font-size="9" fill="#111827">Sincerely,</text>
  <text x="353" y="711" text-anchor="middle" class="sans" font-size="9" fill="#111827">Alex Chen</text>
  <text x="359" y="725" text-anchor="middle" class="sans" font-size="9" fill="#111827">2025-05-18</text>

  <line x1="447" y1="326" x2="447" y2="732" stroke="#d1d5db" stroke-width="2" stroke-dasharray="7 8"/>
  <!-- left bullets -->
  <g class="sans body" fill="#27272a">
    <circle cx="484" cy="376" r="16" class="red"/><text x="484" y="383" text-anchor="middle" font-size="25" fill="#fff" font-weight="800">×</text><text x="515" y="383">Heading drift / 标题层级容易漂移</text>
    <line x1="468" y1="412" x2="754" y2="412" stroke="#e5e7eb"/>
    <circle cx="484" cy="447" r="16" class="red"/><text x="484" y="454" text-anchor="middle" font-size="25" fill="#fff" font-weight="800">×</text><text x="515" y="454">Inconsistent spacing / 段距与行距不一致</text>
    <line x1="468" y1="483" x2="754" y2="483" stroke="#e5e7eb"/>
    <circle cx="484" cy="518" r="16" class="red"/><text x="484" y="525" text-anchor="middle" font-size="25" fill="#fff" font-weight="800">×</text><text x="515" y="525">Signature misalignment / 落款位置易偏移</text>
    <line x1="468" y1="554" x2="754" y2="554" stroke="#e5e7eb"/>
    <circle cx="484" cy="589" r="16" class="red"/><text x="484" y="596" text-anchor="middle" font-size="25" fill="#fff" font-weight="800">×</text><text x="515" y="585">Table/image layout issues /</text><text x="515" y="610">表格和图片不易对齐</text>
    <line x1="468" y1="625" x2="754" y2="625" stroke="#e5e7eb"/>
    <circle cx="484" cy="660" r="16" class="red"/><text x="484" y="667" text-anchor="middle" font-size="25" fill="#fff" font-weight="800">×</text><text x="515" y="667">Hard to reuse / 输出结果不易直接复用</text>
  </g>

  <!-- right panel -->
  <rect x="814" y="190" width="758" height="590" rx="22" fill="#f8fbff" stroke="#83aef2" stroke-width="2"/>
  <text x="1193" y="235" text-anchor="middle" class="sans h2 blue">With FORGE</text>
  <text x="1193" y="268" text-anchor="middle" class="sans body blue">使用 FORGE</text>
  <rect x="985" y="286" width="206" height="36" rx="18" fill="#e6f0ff" stroke="#99baf2"/>
  <text x="1088" y="311" text-anchor="middle" class="sans small blue" font-weight="700">Format-stable DOCX</text>

  <!-- right document -->
  <rect x="841" y="330" width="370" height="398" rx="8" fill="#fff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="864" y="360" class="sans" font-size="20" font-weight="800" fill="#174ea6">1. Project Overview</text>
  <line x1="864" y1="367" x2="1186" y2="367" stroke="#2f6fd0" stroke-width="2"/>
  <text x="864" y="389" class="sans" font-size="12" fill="#374151">This document introduces the project background, goals,</text>
  <text x="864" y="406" class="sans" font-size="12" fill="#374151">and key deliverables.</text>
  <text x="864" y="437" class="sans" font-size="16" font-weight="800" fill="#174ea6">1.1 Background</text>
  <text x="864" y="461" class="sans" font-size="11" fill="#374151">AI is changing how we create content. However, formatting</text>
  <text x="864" y="478" class="sans" font-size="11" fill="#374151">in AI outputs is often inconsistent.</text>
  <text x="864" y="509" class="sans" font-size="16" font-weight="800" fill="#174ea6">1.2 Objectives</text>
  <text x="864" y="533" class="sans" font-size="11" fill="#374151">We aim to provide format-stable DOCX output that is</text>
  <text x="864" y="550" class="sans" font-size="11" fill="#374151">consistent and easy to reuse.</text>
  <text x="864" y="580" class="sans" font-size="18" font-weight="800" fill="#174ea6">2. Deliverables</text>
  <line x1="864" y1="586" x2="1186" y2="586" stroke="#2f6fd0" stroke-width="2"/>
  <text x="864" y="607" class="sans" font-size="10" fill="#374151">The following table summarizes the key deliverables.</text>
  <rect x="864" y="618" width="322" height="70" fill="#fff" stroke="#94a3b8"/>
  <rect x="864" y="618" width="322" height="19" fill="#dbeafe"/>
  <line x1="900" y1="618" x2="900" y2="688" stroke="#94a3b8"/><line x1="1028" y1="618" x2="1028" y2="688" stroke="#94a3b8"/><line x1="1100" y1="618" x2="1100" y2="688" stroke="#94a3b8"/>
  <line x1="864" y1="637" x2="1186" y2="637" stroke="#94a3b8"/><line x1="864" y1="654" x2="1186" y2="654" stroke="#cbd5e1"/><line x1="864" y1="671" x2="1186" y2="671" stroke="#cbd5e1"/>
  <text x="876" y="632" class="sans" font-size="8" font-weight="700">ID</text><text x="930" y="632" class="sans" font-size="8" font-weight="700">Deliverable</text><text x="1050" y="632" class="sans" font-size="8" font-weight="700">Owner</text><text x="1121" y="632" class="sans" font-size="8" font-weight="700">Due Date</text>
  <text x="874" y="649" class="sans" font-size="8">D1</text><text x="910" y="649" class="sans" font-size="8">PRD Document</text><text x="1045" y="649" class="sans" font-size="8">Team A</text><text x="1113" y="649" class="sans" font-size="8">2025-05-20</text>
  <rect x="864" y="696" width="322" height="22" rx="2" fill="#dbeafe"/>
  <path d="M864 716 L918 699 L954 707 L1000 698 L1040 716 Z" fill="#93c5fd"/><path d="M973 716 L1030 697 L1080 707 L1128 698 L1186 716 Z" fill="#60a5fa" opacity=".95"/>
  <text x="1025" y="729" text-anchor="middle" class="sans" font-size="9" fill="#4b5563">Figure 1: Project landscape</text>
  <text x="1164" y="692" text-anchor="end" class="sans" font-size="9" fill="#111827">Sincerely, Alex Chen · 2025-05-18</text>

  <line x1="1233" y1="326" x2="1233" y2="732" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="7 8"/>
  <!-- right bullets -->
  <g class="sans body" fill="#1f2937">
    <circle cx="1270" cy="376" r="16" class="green"/><text x="1270" y="383" text-anchor="middle" font-size="22" fill="#fff" font-weight="800">✓</text><text x="1301" y="371">Stable heading hierarchy /</text><text x="1301" y="396">标题层级清晰稳定</text>
    <line x1="1254" y1="412" x2="1540" y2="412" stroke="#dbeafe"/>
    <circle cx="1270" cy="447" r="16" class="green"/><text x="1270" y="454" text-anchor="middle" font-size="22" fill="#fff" font-weight="800">✓</text><text x="1301" y="442">Consistent spacing /</text><text x="1301" y="467">正文段距统一</text>
    <line x1="1254" y1="483" x2="1540" y2="483" stroke="#dbeafe"/>
    <circle cx="1270" cy="518" r="16" class="green"/><text x="1270" y="525" text-anchor="middle" font-size="22" fill="#fff" font-weight="800">✓</text><text x="1301" y="513">Correct signature placement /</text><text x="1301" y="538">落款位置规范</text>
    <line x1="1254" y1="554" x2="1540" y2="554" stroke="#dbeafe"/>
    <circle cx="1270" cy="589" r="16" class="green"/><text x="1270" y="596" text-anchor="middle" font-size="22" fill="#fff" font-weight="800">✓</text><text x="1301" y="584">Structured media placement /</text><text x="1301" y="609">表格与图片位置规范</text>
    <line x1="1254" y1="625" x2="1540" y2="625" stroke="#dbeafe"/>
    <circle cx="1270" cy="660" r="16" class="green"/><text x="1270" y="667" text-anchor="middle" font-size="22" fill="#fff" font-weight="800">✓</text><text x="1301" y="655">Editable DOCX output /</text><text x="1301" y="680">可继续编辑、可复用的 DOCX</text>
  </g>

  <!-- footer -->
  <rect x="28" y="798" width="1544" height="80" rx="18" fill="url(#footer)"/>
  <g transform="translate(275,816)" stroke="#fff" stroke-width="4" fill="none">
    <path d="M0 0 h38 l18 18 v37 H0z"/><path d="M38 0 v18 h18"/><path d="M12 29 h28 M12 40 h22"/>
    <circle cx="53" cy="49" r="17" fill="#2f6fd0"/><path d="M44 49 l7 7 12-15"/>
  </g>
  <text x="865" y="836" text-anchor="middle" class="sans" font-size="31" font-weight="800" fill="#fff">AI writes. Templates define. FORGE enforces.</text>
  <text x="865" y="866" text-anchor="middle" class="sans" font-size="24" font-weight="650" fill="#fff">AI 负责写，模板负责定版，FORGE 负责守住格式。</text>
</svg>