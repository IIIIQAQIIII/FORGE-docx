name: FORGE CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest -q
      - name: Legacy template self-test
        run: python test_server.py
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: MCP smoke test
        run: python scripts/mcp_smoke.py
      - name: Build and smoke-test runtime ZIP
        run: python build_release.py
      - name: Verify release assets
        run: |
          test -f dist/forge-word-docx-mcp-v1.2.1.zip
          test -f dist/forge-word-docx-mcp-v1.2.1.zip.sha256
