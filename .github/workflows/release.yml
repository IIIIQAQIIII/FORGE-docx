name: Publish FORGE Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.1'
        required: true
        default: 'v1.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify version matches tag
        shell: bash
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          VERSION="$(tr -d '\r\n' < VERSION)"
          EXPECTED="v${VERSION#v}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match VERSION $VERSION (expected $EXPECTED)."
            exit 1
          fi

      - name: Build release ZIP and SHA256
        run: python build_release.py

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # FORGE ${{ steps.tag.outputs.tag }}

          **Format-Oriented Rendering & Generation Engine**  
          **面向 AI Agent 的模板驱动 Word DOCX 生成与格式约束引擎**

          > **Forge documents that don’t break.**  
          > **锻造不会崩坏的文档。**  
          > **AI writes. FORGE holds the format.**  
          > **AI 负责写内容，FORGE 负责守住格式。**

          ## English

          FORGE is a local stdio MCP engine that turns structured AI-generated content into editable Word DOCX files while preserving reusable template formatting.

          ### Highlights
          - Local stdio MCP server for Codex, DeepSeek Harness / DSH, and other MCP clients
          - Template-driven DOCX generation with validation and conservative light repair
          - 11 sanitized public Word templates
          - Official-document, long-form, weekly-report, activity, and training workflows
          - macOS / Linux and Windows installers
          - MIT licensed

          ### Requirements
          - Python 3.10+

          ### Install
          Clone the repository and run `install_mcp.sh` on macOS/Linux or `install_mcp.ps1` on Windows.

          ### Downloads
          This Release includes the FORGE ZIP package and its SHA256 checksum.

          ---

          ## 中文说明

          FORGE 是一个本地运行的 stdio MCP 文档引擎，用于将 AI 生成的结构化内容稳定写入可复用 Word 模板，生成可继续编辑的 DOCX 文档。

          核心理念是：**AI 负责理解需求和生成内容，模板负责定义版式，FORGE 负责渲染、约束、校验与轻量修复。**

          ### 主要特性
          - 支持 Codex、DeepSeek Harness / DSH 以及其他 stdio MCP 客户端
          - 基于模板生成 DOCX，尽量避免标题、段距、页边距、表格、图片等格式漂移
          - 内置 11 个已脱敏的公开 Word 模板
          - 支持传统公文、计划、总结、方案、汇报、报告、请示、论文、行政周报、活动资料与培训资料等场景
          - 支持成套文档批量生成、图片与三线表插入
          - 提供 DOCX 基础校验与安全的轻量修复
          - 提供 macOS / Linux 与 Windows 安装脚本
          - 使用 MIT License 开源

          ### 环境要求
          - Python 3.10+

          ### 安装方式
          克隆仓库后：
          - macOS / Linux：运行 `bash install_mcp.sh`
          - Windows PowerShell：运行 `powershell -ExecutionPolicy Bypass -File .\install_mcp.ps1`

          详细安装与客户端配置方式见仓库中的 `INSTALL.md`。

          ### 下载与校验
          本 Release 提供：
          - `forge-docx-${{ steps.tag.outputs.tag }}.zip`：FORGE 完整发行包
          - `forge-docx-${{ steps.tag.outputs.tag }}.zip.sha256`：SHA256 校验文件

          建议下载后使用 SHA256 校验文件确认发行包完整性。
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          ZIP="$(ls dist/forge-docx-${TAG}.zip)"
          SHA="${ZIP}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            gh release edit "$TAG" --title "FORGE $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --title "FORGE $TAG" \
              --notes-file release-notes.md
          fi
